# Release settings for scripts/release.py and .github/workflows/release.yml.
# Every line is optional. A commented-out line shows the default, and a comment
# above it gives a little insight into what it does.
#
# DEFAULTS = {
#     "PK_RELEASE_TARGETS":     "linux-x86_64 linux-armv8 macos-armv8 windows-ucrt64 windows-clangarm64",
#     "PK_RELEASE_RUNNERS":   "",
#     "PK_RELEASE_TYPE":        "Release",
#     "PK_RELEASE_TESTS":       "ON",
#     "PK_RELEASE_PK_FLAGS":  "",
#     "PK_RELEASE_STRIP":       "ON",
#     "PK_RELEASE_EXCLUDE":   "",
#     "PK_RELEASE_HOOK":      "",
#     "PK_RELEASE_RUNTIME":     "bundle",
#     "PK_RELEASE_MACOS_MIN": "",
#     "PK_RELEASE_ARCHIVE":     "ON",
#     "PK_RELEASE_NAME":        "{project}-{version}-{target}",
#     "PK_RELEASE_FILES":       "LICENSE",
#     "PK_RELEASE_ASSETS":    "",
#     "PK_RELEASE_EXTRA":     "",
#     "PK_RELEASE_NOTES":       "scripts/helpers/release/NOTES.md",
#     "PK_RELEASE_HASH_LINK": "",
#     "PK_RELEASE_DRAFT":       "ON",
#     "PK_RELEASE_README":    "",
# }
#
# Full reference: 'cmake/projectkit/docs/RELEASE.md'

# BUILT -----------------------------------------------------------------------

# Targets released on a tag push ('./scripts/release.py list' shows them all).
#PK_RELEASE_TARGETS="linux-x86_64 linux-armv8 macos-armv8 windows-ucrt64 windows-clangarm64"

# Replace the GitHub runner of a target, e.g. an older Ubuntu for an older glibc.
#PK_RELEASE_RUNNERS="linux-x86_64=ubuntu-22.04"

#PK_RELEASE_TYPE="Release"

# Run the tests on native targets before anything is shipped.
#PK_RELEASE_TESTS="ON"

# Extra pk flags for the release build, e.g. "--lto -O VALGRIND=OFF".
#PK_RELEASE_PK_FLAGS=""

# INSTALLED -------------------------------------------------------------------

# cmake --install --strip: much smaller binaries, no debug symbols.
#PK_RELEASE_STRIP="ON"

# Globs (relative to the install tree) removed before packing. An app-only
# release drops the SDK files with:
#PK_RELEASE_EXCLUDE="include/* lib/cmake/* lib/pkgconfig/* lib/*.a"

# Python script run after the install, before the checks and signing:
#   python HOOK TARGET STAGE_DIR   (also PK_RELEASE_TARGET, _STAGE, _VERSION, _PROJECT)
#PK_RELEASE_HOOK="scripts/helpers/release/hook.py"

# Windows toolchain DLLs (libstdc++, libgcc_s, libwinpthread, libc++, ...):
#   bundle  copy them next to the binaries that need them
#   forbid  fail the release, for projects that link with -static
#   ignore  ship as is
#PK_RELEASE_RUNTIME="bundle"

# Oldest macOS the binaries run on. Empty means the runner's own version.
#PK_RELEASE_MACOS_MIN=""

# ATTACHED --------------------------------------------------------------------

# One archive per target (.zip for Windows, .tar.gz elsewhere) of the whole
# install tree. Drop the version from the name to get stable
# releases/latest/download/... links.
#PK_RELEASE_ARCHIVE="ON"
#PK_RELEASE_NAME="{project}-{version}-{target}"

# Repository files added to the top of every archive.
#PK_RELEASE_FILES="LICENSE"

# Files from the install tree also attached on their own, '.exe' is added on
# Windows. Named FILE-TARGET.ext, or FILE.ext when only one target is released.
#PK_RELEASE_ASSETS="bin/qcdx"

# Repository files attached once to the release, e.g. an end-user guide.
#PK_RELEASE_EXTRA=""

# THE RELEASE -----------------------------------------------------------------

# Notes template. {project} {version} {tag} {repository} {assets}; {assets}
# is a table of every file with its size and SHA-256.
#PK_RELEASE_NOTES="scripts/helpers/release/NOTES.md"

# Turns every hash in {assets} into a link, e.g. a malware scan:
#PK_RELEASE_HASH_LINK="https://www.virustotal.com/gui/file/{sha256}"

# Create the release as a draft, published by hand after checking it.
#PK_RELEASE_DRAFT="ON"

# Kept in sync with the README.md of a separate releases repository
# (repository variable RELEASES_REPO).
#PK_RELEASE_README=""
