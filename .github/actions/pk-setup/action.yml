name: pk-setup
description: >-
  Toolchain, Conan, the Conan cache and optionally ccache for a verify/release
  target. Used by workflows to only have to set up a target once.

inputs:
  target:
    description: A target name from cmake/projectkit/scripts/pklib/targets.py.
    required: true
  msystem:
    description: MSYS2 environment (UCRT64, CLANG64, CLANGARM64), Windows only.
    default: ''
  cache:
    description: >-
      'save' restores the Conan cache and saves it when the job succeeds,
      'restore' doesn't save, 'manual' only restores and leaves saving to
      caller (with the outputs conan-key and conan-hit).
    default: save
  compiler-cache:
    description: >-
      'true' installs ccache (kit uses when found) and restores its cache.
      Saving is up to the caller.
    default: 'false'
  conan-version:
    description: Conan version pip installs.
    default: '2.33.0'
  llvm-mingw-tag:
    description: llvm-mingw release tag (cross-aarch64-mingw-llvm-w64 only).
    default: '20260616'
  llvm-mingw-asset:
    description: Asset of that release to download (Linux x86_64 UCRT build).
    default: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
  llvm-mingw-sha256:
    description: SHA-256 of that asset, checked before it is unpacked.
    default: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda

outputs:
  conan-key:
    description: Conan cache key for this target and its dependency files.
    value: ${{ steps.conan-key.outputs.key }}
  conan-hit:
    description: "'true' when Conan cache was restored from conan-key."
    value: ${{ steps.conan-save.outputs.cache-hit || steps.conan-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    #  Linux and macOS
    # -------------------------------------------------------------------------

    - if: runner.os != 'Windows'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - if: runner.os != 'Windows'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install Conan
      if: runner.os != 'Windows'
      shell: bash
      run: python -m pip install --disable-pip-version-check "conan==${{ inputs.conan-version }}"

    # Conan only accepts compiler.cstd=23 from GCC 14. apt should only run when
    # something is missing.
    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CCACHE: ${{ inputs.compiler-cache }}
      run: |
        packages=()
        command -v g++-14 >/dev/null || packages+=(g++-14)
        if [ "$CCACHE" = true ]; then
          command -v ccache >/dev/null || packages+=(ccache)
        fi
        case "$TARGET" in
          cross-x86_64-mingw-w64)  packages+=(g++-mingw-w64-x86-64) ;;
          cross-aarch64-linux-gnu) command -v aarch64-linux-gnu-gcc >/dev/null || packages+=(g++-aarch64-linux-gnu) ;;
          cross-x86_64-linux-gnu)  command -v x86_64-linux-gnu-gcc  >/dev/null || packages+=(g++-x86-64-linux-gnu) ;;
        esac
        if [ ${#packages[@]} -gt 0 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
        fi
        if [ "$TARGET" = cross-x86_64-mingw-w64 ]; then
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
        fi
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    # No auto update: it can take longer than everything else in this action.
    - name: Install ccache
      if: runner.os == 'macOS' && inputs.compiler-cache == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: command -v ccache >/dev/null || brew install ccache

    - name: Install llvm-mingw
      if: inputs.target == 'cross-aarch64-mingw-llvm-w64'
      shell: bash
      env:
        TAG: ${{ inputs.llvm-mingw-tag }}
        ASSET: ${{ inputs.llvm-mingw-asset }}
        SHA256: ${{ inputs.llvm-mingw-sha256 }}
      run: |
        archive="$RUNNER_TEMP/$ASSET"
        curl -fsSL -o "$archive" "https://github.com/mstorsjo/llvm-mingw/releases/download/${TAG}/${ASSET}"
        echo "${SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/llvm-mingw"
        tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
        rm -f "$archive"
        echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

    - name: Point Conan at the runner temp directory
      if: runner.os != 'Windows'
      shell: bash
      run: echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"

    # -------------------------------------------------------------------------
    # Windows (MSYS2)
    # -------------------------------------------------------------------------

    - if: runner.os == 'Windows'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: git
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          python-pip:p
          pkgconf:p
          ${{ inputs.compiler-cache == 'true' && 'ccache:p' || '' }}

    # Visual Studio is installed on the runner used, Conan prefers
    # MSVC on Windows, CC/CXX override it.
    - name: Select the MSYS2 compiler
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYSTEM_NAME: ${{ inputs.msystem }}
      run: |
        if ($env:MSYSTEM_NAME -like 'CLANG*') { $cc = 'clang'; $cxx = 'clang++' } else { $cc = 'gcc'; $cxx = 'g++' }
        "CC=$cc" >> $env:GITHUB_ENV
        "CXX=$cxx" >> $env:GITHUB_ENV
        "CONAN_HOME=$env:RUNNER_TEMP\conan2" >> $env:GITHUB_ENV

    - name: Install Conan
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: python -m pip install --disable-pip-version-check --break-system-packages "conan==${{ inputs.conan-version }}"

    # -------------------------------------------------------------------------
    # Conan cache
    # -------------------------------------------------------------------------

    # The profiles are under profiles/, or wherever .pk/tree.conf puts them.
    - name: Find the Conan profiles
      id: tree
      shell: bash
      run: |
        profiles=profiles
        if [ -f .pk/tree.conf ]; then
          value="$(awk -F= 'tolower($1) ~ /^[ \t]*(pk_tree_)?profiles[ \t]*$/ { v = $2 }
            END { gsub(/["\r]/, "", v); gsub(/^[ \t]+|[ \t]+$/, "", v); print v }' .pk/tree.conf)"
          [ -n "$value" ] && profiles="$value"
        fi
        echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

    - name: Conan cache key
      id: conan-key
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        HASH: ${{ hashFiles('conanfile.py', 'deps.json', 'conan.lock', format('{0}/**', steps.tree.outputs.profiles)) }}
      run: echo "key=conan-$TARGET-$HASH" >> "$GITHUB_OUTPUT"

    # The key is shared with verify.yml, and caches saved on main can be read
    # from every branch and tag: release runs will reuse verify's packages,
    # NEVER storing a wasteful second copy.
    #
    # The first restore key also matches '<key>-partial-...', the packages a
    # verify run managed to build before it failed or ran out of time; the next
    # run only builds what's missing.
    - if: inputs.cache == 'save'
      id: conan-save
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/conan2/p
        key: ${{ steps.conan-key.outputs.key }}
        restore-keys: |
          ${{ steps.conan-key.outputs.key }}
          conan-${{ inputs.target }}-

    - if: inputs.cache == 'restore' || inputs.cache == 'manual'
      id: conan-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/conan2/p
        key: ${{ steps.conan-key.outputs.key }}
        restore-keys: |
          ${{ steps.conan-key.outputs.key }}
          conan-${{ inputs.target }}-

    # -------------------------------------------------------------------------
    # Compiler cache
    # -------------------------------------------------------------------------

    - name: Point ccache at the runner temp directory
      if: inputs.compiler-cache == 'true'
      shell: bash
      env:
        DIR_VALUE: ${{ runner.temp }}/ccache
      run: |
        echo "CCACHE_DIR=$DIR_VALUE" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

    - if: inputs.compiler-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.target }}-${{ github.run_id }}
        restore-keys: ccache-${{ inputs.target }}-

    - name: Detect the default Conan profile
      if: runner.os != 'Windows'
      shell: bash
      run: conan profile detect --force

    - name: Detect the default Conan profile
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: conan profile detect --force
