name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/release.yml'
      - 'scripts/helpers/release/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/release.yml'
      - 'scripts/helpers/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64,                 os: ubuntu-24.04 }
          - { target: linux-armv8,                  os: ubuntu-24.04-arm }
          - { target: macos-armv8,                  os: macos-15 }
          - { target: cross-x86_64-mingw-w64,       os: ubuntu-24.04 }
          - { target: cross-aarch64-mingw-llvm-w64, os: ubuntu-24.04 }
          - { target: windows-ucrt64,               os: windows-2022, msystem: UCRT64, timeout: 120 }
    defaults:
      run:
        shell: ${{ matrix.msystem && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain, Conan and the Conan cache (shared with release.yml).
      - uses: ./.github/actions/pk-setup
        with:
          target: ${{ matrix.target }}
          msystem: ${{ matrix.msystem }}

      - name: Check dependencies
        if: matrix.target == 'linux-x86_64'
        run: ./scripts/pk.py dep check

      - name: Verify
        run: ./scripts/verify.py run ${{ matrix.target }}
