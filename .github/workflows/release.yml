name: release

# Pushing a tag like v1.2.0 builds, tests and (when enabled) signs every target
# in scripts/helpers/release/release.conf, then creates a DRAFT release. The
# release is not public until the draft is manually published.
#
# Running this workflow manually (Actions > release > Run workflow) builds the
# same artifacts without releasing anything, used to test a pipeline change.
#
# Everything a job does is './scripts/release.py <command>', which also runs
# locally.
#
# Settings: 'scripts/helpers/release/release.conf'
# Reference: 'cmake/projectkit/docs/RELEASE.md'
#
# Repository variables (all optional):
#   RELEASES_REPO     owner/name to release into, default this repository
#                     (needs the secret RELEASES_TOKEN: contents read/write)
#   SIGNING_ENABLED   'true' signs Windows binaries with Azure Artifact Signing
#                     (needs SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE
#                     and the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID,
#                     AZURE_SUBSCRIPTION_ID)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: Space separated targets to build (empty uses release.conf)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  # Catch a wrong tag
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      draft: ${{ steps.plan.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TARGETS: ${{ inputs.targets }}
          PK_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          PK_HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
          PK_SIGNING: ${{ vars.SIGNING_ENABLED == 'true' && github.ref_type == 'tag' }}
          PK_SIGNING_READY: >-
            ${{ vars.SIGNING_ENDPOINT != '' && vars.SIGNING_ACCOUNT != '' && vars.SIGNING_PROFILE != ''
            && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: python3 scripts/release.py plan "--tag=$TAG" "--targets=$TARGETS"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      # azure/login exchanges a GitHub OIDC token; unused while signing is off.
      id-token: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      SIGN: ${{ vars.SIGNING_ENABLED == 'true' && github.ref_type == 'tag' && matrix.signable }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pk-setup
        with:
          target: ${{ matrix.target }}
          msystem: ${{ matrix.msystem }}
          cache: restore

      - name: Build, test and stage
        id: stage
        run: python scripts/release.py stage ${{ matrix.target }}

      # Signing happens on staged tree (after strip and hook, before files are
      # archived).
      - name: Azure login
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ steps.stage.outputs.stage }}
          files-folder-filter: exe,dll
          files-folder-recurse: true

      - name: Confirm the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          $bad = 0
          Get-ChildItem -LiteralPath $env:STAGE -Recurse -File -Include *.exe, *.dll | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Output "::error::$($_.Name): signature status $($signature.Status)"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Pack
        run: python scripts/release.py pack ${{ matrix.target }} ${{ matrix.plain && '--plain' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: build/release/dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [plan, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/release/dist
          merge-multiple: true

      - name: Checksums and notes
        id: final
        run: python3 scripts/release.py finalize "--tag=$GITHUB_REF_NAME"

      # Anyone can check where a file came from with the command:
      # 'gh attestation verify <file> -R <owner/repo>'
      # (Public repositories only).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.final.outputs.sums }}

      # Re-running updates it's created draft only; a publicly published
      # release is is not changed/updated.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.final.outputs.title }}
          NOTES: ${{ steps.final.outputs.notes }}
          DIST: ${{ steps.final.outputs.dist }}
          DRAFT: ${{ needs.plan.outputs.draft }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$DRAFT" = true ] && flags+=(--draft)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if state="$(gh release view "$TAG" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != true ]; then
              echo "::error::Release $TAG is already published in $RELEASES_REPO; delete it or push a new tag."
              exit 1
            fi
            gh release upload "$TAG" "$DIST"/* --repo "$RELEASES_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASES_REPO" --title "$TITLE" --notes-file "$NOTES" "${flags[@]}"
          else
            # A separate releases repository gets the tag on its default branch.
            [ "$RELEASES_REPO" = "$GITHUB_REPOSITORY" ] && flags+=(--verify-tag)
            gh release create "$TAG" "$DIST"/* --repo "$RELEASES_REPO" --title "$TITLE" \
              --notes-file "$NOTES" "${flags[@]}"
          fi
          {
            echo "### ${TITLE}: release ${TAG} in ${RELEASES_REPO}"
            echo
            cat "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # The releases repository's README will update to the PK_RELEASE_README
      # from the commit this release is built from; skipped when unchanged.
      - name: Sync the releases repository README
        if: steps.final.outputs.readme != '' && env.RELEASES_REPO != github.repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          README: ${{ steps.final.outputs.readme }}
        run: |
          set -euo pipefail
          path="repos/$RELEASES_REPO/contents/README.md"
          local="$(base64 -w0 "$README")"
          sha=""
          if remote="$(gh api "$path" 2>/dev/null)"; then
            sha="$(jq -r .sha <<<"$remote")"
            if [ "$(jq -r .content <<<"$remote" | tr -d '\n')" = "$local" ]; then
              echo "README.md is already up to date"
              exit 0
            fi
          fi
          args=(-X PUT "$path" --silent -f "message=Update README for $GITHUB_REF_NAME" -f "content=$local")
          [ -n "$sha" ] && args+=(-f "sha=$sha")
          gh api "${args[@]}"
          echo "README.md updated for $GITHUB_REF_NAME"
