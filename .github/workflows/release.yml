name: release

# Pushing a tag like v0.2.0 (it must equal cmake/projectkit/VERSION) runs the
# whole ci workflow, then publishes the very artifacts it tested:
#
#   PyPI             qcdx-X.Y.Z-py3-none-any.whl, qcdx-X.Y.Z.tar.gz
#   GitHub release   the same two, pk.pyz and SHA256SUMS
#
# One-time setup:
#   PyPI: add a trusted publisher for project 'qcdx': owner cooldood155,
#         repository QCDX, workflow release.yml, environment pypi
#   GitHub: Settings > Environments > New environment 'pypi' (optionally with
#         required reviewers, to approve each upload)
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches cmake/projectkit/VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < cmake/projectkit/VERSION)"
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            "v$version")   prerelease=false ;;
            "v$version"-*) prerelease=true ;;
            *) echo "::error::tag $tag but cmake/projectkit/VERSION is $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/qcdx/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the wheel and sdist
        run: rm -f dist/pk.pyz && ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github:
    needs: [plan, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          sdist_sha="$(awk '/qcdx-.*\.tar\.gz$/ {print $1}' dist/SHA256SUMS)"
          cat > notes.md <<EOF
          ## Install

          \`\`\`bash
          pipx install qcdx==${VERSION}
          \`\`\`

          Or download \`pk.pyz\` below and run \`python pk.pyz new myproject\` (Python 3.9+, nothing else).

          ## Use the kit from CMake, without pk new

          \`\`\`cmake
          FetchContent_Declare(qcdx
            URL      https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/qcdx-${VERSION}.tar.gz
            URL_HASH SHA256=${sdist_sha})
          FetchContent_MakeAvailable(qcdx)
          find_package(QCDX ${VERSION%.*} REQUIRED)
          include(ProjectKit)
          \`\`\`

          Existing projects update their kit with \`pk sync\`.

          Every file is listed in \`SHA256SUMS\` and has a build provenance attestation:
          \`gh attestation verify FILE -R ${GITHUB_REPOSITORY}\`
          EOF
          flags=(--verify-tag --title "QCDX ${VERSION}" --notes-file notes.md --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
