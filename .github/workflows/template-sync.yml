name: template-sync

# Keeps cooldood155/QCDX-template equal to what 'pk new qcdx' creates: after
# every successful release (and when run by hand) it generates the project from
# that QCDX commit, adds dev/template-repo/README.md, LICENSE and docs/, and
# pushes the difference as one commit. Nothing is pushed when nothing changed.
#
# One-time setup: a fine-grained personal access token with access to
# cooldood155/QCDX-template only and "Contents: Read and write", stored in this
# repository as the secret TEMPLATE_REPO_TOKEN. A token (not GITHUB_TOKEN) is
# needed to push to another repository, and it also lets that push start
# QCDX-template's own verify workflow.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: QCDX tag, branch or commit to generate from
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: template-sync
  cancel-in-progress: false

env:
  TEMPLATE_REPO: cooldood155/QCDX-template
  DESCRIPTION: Template project built on ProjectKit
  AUTHOR: Evan R. Reumann (evanrileyreumann@gmail.com)
  LICENSE_ID: MIT

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the token
        env:
          HAS_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::the secret TEMPLATE_REPO_TOKEN is not set (see the top of template-sync.yml)"
            exit 1
          fi

      # Full history: 'git describe' names the version, and pk new records the
      # commit in upstream.conf as the base for the template's first pk sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: qcdx

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: template-repo

      - name: Generate with pk new
        id: generate
        working-directory: qcdx
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          PYTHONPATH=src python3 -m qcdx new qcdx "$out" --no-git \
            --description="$DESCRIPTION" --author="$AUTHOR" \
            --url="https://github.com/$TEMPLATE_REPO" --license="$LICENSE_ID"
          cp dev/template-repo/README.md "$out/README.md"
          cp LICENSE "$out/LICENSE"
          cp -R docs "$out/docs"
          echo "describe=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mirror into QCDX-template and push
        working-directory: template-repo
        env:
          DESCRIBE: ${{ steps.generate.outputs.describe }}
          SHA: ${{ steps.generate.outputs.sha }}
        run: |
          set -euo pipefail
          # Mirror: everything but .git is replaced, so files QCDX dropped go too.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/generated/." ./
          git add -A
          if git diff --cached --quiet; then
            echo "QCDX-template already matches QCDX $DESCRIBE" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync with QCDX $DESCRIBE" \
            -m "Generated by 'pk new qcdx' from cooldood155/QCDX@$SHA."
          git push origin HEAD
          {
            echo "### QCDX-template synced with QCDX $DESCRIBE"
            echo
            echo '```text'
            git show --stat --format='%h %s' HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
