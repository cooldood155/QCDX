# minimal: only your code and the files tools need at the root. The kit, the
# scripts, the settings and the profiles live in .pk/ (still all there, only
# out of sight); the build-time tool sample, clangd and pre-commit are left out.
#
#   pk new NAME --tree=minimal
#
# Copy this file to ~/.pk/trees/NAME.conf (PK_HOME moves ~/.pk) to make your
# own tree, then: pk new PROJECT --tree=NAME

kit        = .pk/projectkit
scripts    = .pk/scripts
helpers    = .pk/settings
profiles   = .pk/profiles
toolchains = .pk/toolchains
cmake      = .pk/cmake
headers    = include
sources    = src
apps       = apps
tests      = tests
omit       = tools clangd pre-commit
