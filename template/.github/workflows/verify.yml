name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/release.yml'
      - 'scripts/helpers/release/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '**.png'
      - '**.jpg'
      - '**.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/release.yml'
      - 'scripts/helpers/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64,                 os: ubuntu-24.04 }
          - { target: linux-armv8,                  os: ubuntu-24.04-arm }
          - { target: macos-armv8,                  os: macos-15 }
          - { target: cross-x86_64-mingw-w64,       os: ubuntu-24.04 }
          - { target: cross-aarch64-mingw-llvm-w64, os: ubuntu-24.04 }
          - { target: windows-ucrt64,               os: windows-2022, msystem: UCRT64, timeout: 120 }
    defaults:
      run:
        shell: ${{ matrix.msystem && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain, Conan, ccache and the caches (Conan's shared with release.yml).
      - uses: ./.github/actions/pk-setup
        id: setup
        with:
          target: ${{ matrix.target }}
          msystem: ${{ matrix.msystem }}
          cache: manual
          compiler-cache: 'true'

      - name: Dependencies
        id: deps
        if: steps.setup.outputs.conan-hit != 'true'
        continue-on-error: true
        run: ./scripts/verify.py deps ${{ matrix.target }}

      # Only packages are cached
      - name: Trim the Conan cache
        if: always() && steps.deps.outcome != 'skipped'
        run: conan cache clean "*"

      - name: Save the Conan cache
        if: always() && steps.deps.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conan2/p
          key: >-
            ${{ steps.deps.outcome == 'success' && steps.setup.outputs.conan-key
            || format('{0}-partial-{1}-{2}', steps.setup.outputs.conan-key, github.run_id, github.run_attempt) }}

      - name: Check dependencies
        if: matrix.target == 'linux-x86_64'
        run: ./scripts/pk.py dep check

      - name: Verify
        run: ./scripts/verify.py run ${{ matrix.target }}

      - name: Compiler cache statistics
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        run: ccache --show-stats

      - name: Save the compiler cache
        if: always() && steps.setup.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
