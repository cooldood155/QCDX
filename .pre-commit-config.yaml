# pre-commit: https://pre-commit.com
#
#   pre-commit install          // run the hooks on every commit
#   pre-commit run --all-files  // run hooks on the whole tree
#   pre-commit autoupdate       // bumps every rev and re-runs
#
# Hooks that fix files (whitespace, line endings, clang-format) fail the
# commit and leave their fixes unstaged. Review fixes, stage them and commit.

minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit, manual]

repos:
  # Whitespace, line endings, merge leftovers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf] # .gitattributes: eol=lf
      - id: check-merge-conflict
      - id: check-case-conflict # Windows/macOS file systems ignore case
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # Text stays ASCII.
  - repo: local
    hooks:
      - id: ascii-only
        name: ascii only
        language: pygrep
        entry: "[^\\x00-\\x7F]"
        types: [text]

  # Python: lint only! Default rules. The scripts/*.py wrappers import after
  # their sys.path setup, on purpose.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args:
          - --select=E4,E7,E9,F
          - --per-file-ignores=scripts/*.py:E402

  # C and C++: template's .clang-format.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^template/

  # GitHub workflows and actions checked against their JSON schemas.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        files: ^(template/)?\.github/workflows/[^/]+\.ya?ml$
      - id: check-github-actions
